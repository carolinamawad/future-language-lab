<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Future Language Lab | C1</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #070b14;
      color: #f4f7ff;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 220, 255, 0.12), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(160, 90, 255, 0.12), transparent 30%);
      pointer-events: none;
      z-index: -1;
    }

    /* NAVIGATION */

    nav {
      width: 100%;
      padding: 24px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,11,20,0.75);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .logo span {
      color: #6ee7ff;
    }

    .level {
      font-size: 13px;
      letter-spacing: 2px;
      padding: 8px 14px;
      border: 1px solid rgba(110,231,255,0.4);
      border-radius: 30px;
      color: #6ee7ff;
    }

    /* HERO */

    .hero {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 20px;
      position: relative;
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #6ee7ff;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 100px);
      line-height: 0.95;
      letter-spacing: -4px;
      max-width: 1100px;
      margin-bottom: 28px;
    }

    h1 span {
      background: linear-gradient(90deg, #ffffff, #6ee7ff, #b98cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(18px, 2vw, 25px);
      color: #aab4c7;
      max-width: 750px;
      line-height: 1.6;
      margin-bottom: 45px;
    }

    .start-button {
      display: inline-block;
      padding: 17px 34px;
      border-radius: 50px;
      border: 1px solid rgba(110,231,255,0.7);
      color: white;
      text-decoration: none;
      letter-spacing: 2px;
      font-size: 13px;
      transition: 0.3s ease;
      background: rgba(110,231,255,0.06);
    }

    .start-button:hover {
      background: rgba(110,231,255,0.15);
      transform: translateY(-3px);
      box-shadow: 0 0 35px rgba(110,231,255,0.2);
    }

    /* TABS */

    .tabs {
      width: min(1100px, 92%);
      margin: 0 auto 80px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .tab {
      padding: 24px 18px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      background: rgba(255,255,255,0.025);
      color: #dce4f3;
      transition: 0.3s ease;
    }

    .tab:hover {
      transform: translateY(-5px);
      border-color: rgba(110,231,255,0.45);
      background: rgba(110,231,255,0.06);
    }

    .tab-number {
      font-size: 11px;
      color: #6ee7ff;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .tab-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 30px;
      color: #687386;
      font-size: 12px;
      letter-spacing: 1px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    @media (max-width: 700px) {
      .tabs {
        grid-template-columns: 1fr 1fr;
      }

      h1 {
        letter-spacing: -2px;
      }
    }

    @media (max-width: 450px) {
      .tabs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">
      FUTURE<span>LANGUAGE</span>LAB
    </div>

    <div class="level">
      CEFR · C1
    </div>
  </nav>

  <main>

    <section class="hero">

      <div class="eyebrow">
        ONLINE LEARNING MODULE · 01
      </div>

      <h1>
        <span>Future Trends</span><br>
        in Language Teaching
      </h1>

      <p class="subtitle">
        Predicting and Justifying Possibilities
      </p>

      <a href="#module" class="start-button">
        ENTER THE LAB →
      </a>

    </section>


    <section class="tabs" id="module">

      <div class="tab">
        <div class="tab-number">01</div>
        <div class="tab-title">LEARNING OBJECTIVES</div>
      </div>

      <div class="tab">
        <div class="tab-number">02</div>
        <div class="tab-title">CONTENT</div>
      </div>

      <div class="tab">
        <div class="tab-number">03</div>
        <div class="tab-title">ACTIVITIES</div>
      </div>

      <div class="tab">
        <div class="tab-number">04</div>
        <div class="tab-title">ASSESSMENT</div>
      </div>

    </section>

  </main>


  <footer>
    FUTURE LANGUAGE LAB · C1 · PREDICTING & JUSTIFYING POSSIBILITIES
  </footer>

</body>
</html>
